name: selftest
on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    # Runs the checks that need no network and no agent CLI. Network checks (keeper.py check,
    # github-research selftest) and agent runs stay local, because they need tokens and quota.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Checks
        run: python tests/run_checks.py
